  iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }

  #loader {
    position:absolute; inset:0; z-index:2;

  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader span { font-size:14px; opacity:.85; text-align:center; padding:0 20px; }

  #back-link {
    position:absolute; top:10px; left:10px; z-index:3;

    color:#fff; background:rgba(0,0,0,.55); padding:6px 12px; border-radius:6px;

  }
  body:hover #back-link, #back-link:focus { opacity:1; }
</style>
</head>
